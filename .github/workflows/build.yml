name: Build Windows x64

# 手动触发 / push 到 main / 推送 v* 标签（标签会自动发布 Release）
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    name: Build & Package (win-x64)
    runs-on: windows-latest

    env:
      PROJECT: src/NewApiOrb/NewApiOrb.csproj
      OUTDIR: dist/NewApiOrb

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 解析版本号
        id: ver
        shell: pwsh
        run: |
          $v = ''
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            [xml]$xml = Get-Content $env:PROJECT
            $v = ($xml.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
          }
          if ([string]::IsNullOrWhiteSpace($v)) { $v = '0.0.0' }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "构建版本: $v"

      - name: 还原依赖
        run: dotnet restore $env:PROJECT

      - name: 发布单文件
        shell: pwsh
        run: |
          dotnet publish $env:PROJECT `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -p:Version=${{ steps.ver.outputs.version }} `
            -o $env:OUTDIR

      - name: 校验产物
        shell: pwsh
        run: |
          $exe = Join-Path $env:OUTDIR 'NewApiOrb.exe'
          if (-not (Test-Path $exe)) { throw "未生成 $exe" }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "产物: NewApiOrb.exe  $mb MB"
          @"
          ## 构建成功
          - 版本：${{ steps.ver.outputs.version }}
          - 产物：NewApiOrb.exe（$mb MB，自包含单文件）
          - 运行时：win-x64 / .NET 10
          "@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: 打包 zip
        id: pack
        shell: pwsh
        run: |
          $zip = "dist/NewApiOrb-v${{ steps.ver.outputs.version }}-win-x64.zip"
          Compress-Archive -Path "$env:OUTDIR/*" -DestinationPath $zip -Force
          Write-Host "已打包: $zip"
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: NewApiOrb-v${{ steps.ver.outputs.version }}-win-x64
          path: dist/*.zip
          if-no-files-found: error

      - name: 打标签时发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "${{ steps.pack.outputs.zip }}" `
            --title "NewApiOrb ${{ github.ref_name }}" `
            --generate-notes
